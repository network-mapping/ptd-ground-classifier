# ground-classify settings. Every section and key is optional: a missing one uses the value shown here.
# Found as --config, $GROUND_CLASSIFIER_CONFIG, ./ground_classifier_config.yml or ./config/ground_classifier_config.yml.

# The LAS/LAZ files being classified. The setting applies to every file processed in one run - keep
# files of different units in separate runs. The same option on the command line (--units) takes
# priority over this file.
input:
  # Coordinate unit of the files: auto, usft or metres. 'auto' reads each file's own CRS metadata
  # and only proceeds when the unit is unambiguous; the tool refuses to guess rather than silently
  # corrupt output. If a file has no CRS metadata (common - many production LAS files omit it), set
  # usft or metres explicitly.
  units: auto
  # Metres around each tile that are read from the adjacent tiles, so ground near a tile edge is
  # classified with its neighbours' points. This changes classifications near tile edges. 0 = no
  # neighbour context.
  neighbour_halo: 10.0

# Speed settings only - neither changes any classification result. The same options on the command
# line (--workers, --ram-limit-gb) take priority over this file.
performance:
  # Total CPU threads to use. 0 = automatic (80% of logical CPUs).
  workers: 0
  # RAM budget in GB for files processed at the same time. 0 = automatic (55% of installed RAM). On
  # a machine dedicated to this run a larger value lets more files run at once; 4 GB of free RAM is
  # always kept spare whatever is entered.
  ram_limit_gb: 0.0

# The DTM rasters written by --export-dtm. Each cell holds the lowest ground point in it; cells
# without one are nodata. The same option on the command line (--dtm-cell) takes priority over this
# file.
dtm:
  # Cell size in the unit of the input coordinates (feet for a feet project, metres for a metric
  # one). 0 = the default: 1 for metres, 3 for feet.
  cell_size: 0.0

# Vegetation height above ground (HAG) bands, in metres. Above high_veg_max a point becomes class 7
# (noise/outlier).
hag:
  # Class 3 ceiling. (These values are 2 ft / 10 ft / 2000 ft, for feet projects.)
  low_veg_max: 0.609
  # Class 4 ceiling (also class 5 floor).
  medium_veg_max: 3.048
  # Class 5 ceiling.
  high_veg_max: 656.0

# Fast-engine settings, all in METRES and degrees whatever the project unit. The first seven carry
# the names of TerraScan's Ground routine settings.
engine:
  # One starting point per square of this size; lower it (20 to 30) on hilly projects where
  # buildings are already in their own class.
  max_building_size: 60.0
  terrain_angle: 70.0
  # Used on flat ground (steep_iteration_angle is used on steep ground).
  iteration_angle: 6.0
  # Used on steep ground.
  steep_iteration_angle: 10.0
  iteration_distance: 1.4
  reduce_iteration_angle_when_edge_shorter_than: 2.0
  stop_triangulation_when_edge_shorter_than: 0.0
  # Points this close to the ground surface are ground too, at most one per 0.3 m square; 0 =
  # surface points only.
  ground_band: 0.02
  # Let the ground continue over hill tops, banks and ridges the plain routine cannot climb.
  follow_surface: true
  # Take single points that stand out of the surface back out.
  remove_spikes: true
