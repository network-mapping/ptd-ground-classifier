# ground-classify settings. Every section and key is optional: a missing one uses the value shown here.
# Found as --config, $GROUND_CLASSIFIER_CONFIG, ./ground_classifier_config.yml or ./config/ground_classifier_config.yml.

# The LAS/LAZ files being classified. The setting applies to every file processed in one run - keep
# files of different units in separate runs. The same option on the command line (--units) takes
# priority over this file.
input:
  # Coordinate unit of the files: auto, metres, usft (US survey feet) or foot (international feet).
  # 'auto' reads the unit from the files' CRS, which every file must carry, be projected and share;
  # the tool refuses to guess rather than silently corrupt output. If the files have no CRS (common
  # - many production LAS files omit it) or you want to override it, state the unit explicitly.
  units: auto
  # Metres around each tile that are read from the adjacent tiles, so ground near a tile edge is
  # classified with its neighbours' points. This changes classifications near tile edges. 0 = no
  # neighbour context.
  neighbour_halo: 10.0

# How a large tile is cut into windows that are classified separately, and in parallel. Unlike the
# performance section, these change classifications near the edges of a window.
windows:
  # Metres. A tile wider or taller than this is cut into windows of about this size (at most 8 per
  # tile; a very dense tile is cut by point count as well).
  block_size: 5000.0
  # Metres. Each window also reads this far beyond its core, so the surface is continuous across
  # window edges. Keep it larger than engine.max_building_size (the starting squares): too small an
  # overlap changes the ground near window edges.
  block_overlap: 80.0

# Speed settings only - neither changes any classification result. The same options on the command
# line (--workers, --ram-limit-gb) take priority over this file.
performance:
  # Total CPU threads to use. 0 = automatic (80% of logical CPUs).
  workers: 0
  # RAM budget in GB for files processed at the same time. 0 = automatic (55% of installed RAM). On
  # a machine dedicated to this run a larger value lets more files run at once; 4 GB of free RAM is
  # always kept spare whatever is entered.
  ram_limit_gb: 0.0

# The DTM rasters written by --export-dtm. Each cell holds the lowest ground point in it; cells
# without one are nodata. The same option on the command line (--dtm-cell) takes priority over this
# file.
dtm:
  # Cell size in the unit of the input coordinates (feet for a feet project, metres for a metric
  # one). 0 = the default: 1 for metres, 3 for feet.
  cell_size: 0.0

# Vegetation height above ground (HAG) bands, in metres. Above high_veg_max a point becomes noise.
hag:
  # Low vegetation ceiling. (These values are 2 ft / 10 ft / 2000 ft, for feet projects.)
  low_veg_max: 0.609
  # Medium vegetation ceiling (also high vegetation floor).
  medium_veg_max: 3.048
  # High vegetation ceiling.
  high_veg_max: 656.0

# Fast-engine settings, all in METRES and degrees whatever the project unit. The first seven carry
# the names of TerraScan's Ground routine settings.
engine:
  # One starting point per square of this size; lower it (20 to 30) on hilly projects where
  # buildings are already in their own class.
  max_building_size: 60.0
  terrain_angle: 70.0
  # Used on flat ground (steep_iteration_angle is used on steep ground).
  iteration_angle: 6.0
  # Used on steep ground.
  steep_iteration_angle: 10.0
  iteration_distance: 1.4
  reduce_iteration_angle_when_edge_shorter_than: 2.0
  stop_triangulation_when_edge_shorter_than: 0.0
  # Points this close to the ground surface are ground too, at most one per 0.3 m square; 0 =
  # surface points only.
  ground_band: 0.02
  # Let the ground continue over hill tops, banks and ridges the plain routine cannot climb.
  follow_surface: true
  # Take single points that stand out of the surface back out.
  remove_spikes: true

# The LAS classification codes. input_feature_codes names the codes of the input files.
# application_feature_codes maps them to the features this tool works with: each feature has the code it
# writes (code) and the input codes it takes over (input_feature_codes). Every input code listed under a
# feature is reset and re-labelled; input codes under no feature are left as they are. Required features:
# unclassified, ground, low_vegetation, medium_vegetation, high_vegetation, noise.
feature_codes:
  # Classification codes found in the input files, with their names.
  input_feature_codes:
    2: Ground
    3: Low Vegetation
    4: Medium Vegetation
    5: High Vegetation
    13: Candidate
  # Feature name -> {code: output code, input_feature_codes: [input codes taken over]}. unclassified holds the
  # input codes that are re-labelled without being ground or vegetation in the input.
  application_feature_codes:
    unclassified: {code: 0, input_feature_codes: [13]}
    ground: {code: 2, input_feature_codes: [2]}
    low_vegetation: {code: 3, input_feature_codes: [3]}
    medium_vegetation: {code: 4, input_feature_codes: [4]}
    high_vegetation: {code: 5, input_feature_codes: [5]}
    noise: {code: 7, input_feature_codes: []}