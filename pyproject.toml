[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ground-classifier"
dynamic = ["version"]
description = "Ground classification of LAS/LAZ point clouds by progressive TIN densification"
requires-python = ">=3.10"
dependencies = [
    "laspy[lazrs]>=2.5",
    "numpy>=1.24",
    "pyyaml>=6",
    "scipy>=1.10",
    "tifffile>=2023.1",
]

[project.scripts]
ground-classify = "ground_classifier.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ground_classifier.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
